name: Sweep
options:
  bundleIdPrefix: com.sweep
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "6.0"
  TARGETED_DEVICE_FAMILY: "1,2"
  IPHONEOS_DEPLOYMENT_TARGET: "26.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Sweep:
    type: application
    platform: iOS
    sources:
      - path: Sweep
        excludes:
          - "**/.DS_Store"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sweep.app
      PRODUCT_NAME: Sweep
      INFOPLIST_FILE: Sweep/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_STRICT_CONCURRENCY: complete
      ENABLE_PREVIEWS: YES
    info:
      path: Sweep/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sweep
        UILaunchScreen_Generation: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  Sweep:
    build:
      targets:
        Sweep: all
    run:
      config: Debug
      environmentVariables:
        SWEEP_API_BASE_URL: https://sweep-app.vercel.app
